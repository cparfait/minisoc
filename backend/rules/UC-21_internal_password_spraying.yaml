id: UC-21
name: Pulvérisation de mots de passe sur l'Active Directory
type: threshold
severity: high
description: >
  Une même adresse essaie des mots de passe sur de nombreux comptes du domaine (Kerberos, NTLM, ouverture de
  session) : poste interne compromis ou outil d'attaque.
filter:
  event.module: windows
  event.category: authentication
  event.outcome: failure
  event.reason: [invalid_credentials, unknown_user]
group_by: [source.ip]
window: 10m
condition: count_distinct(user.name) >= 10
title: "Pulvérisation de mots de passe depuis {source.ip} : {value} comptes en 10 min"
dedup_window: 24h
storm_limit: 3
mitre: [T1110.003]
playbook: playbooks/mass-lockouts.md
