id: UC-25
name: Ouverture de session interactive d'un compte de service
type: match
severity: high
description: >
  Un compte de service ne devrait ouvrir que des sessions de service ou réseau. Une ouverture de session au
  clavier, en bureau à distance (RDP) ou un déverrouillage indique qu'une personne utilise ce compte : partage du
  mot de passe ou compte volé (les comptes de service ont souvent des droits élevés et un mot de passe qui n'expire
  jamais).
filter:
  event.module: windows
  event.category: authentication
  event.outcome: success
  user.roles: {contains: service}
  network.service: [interactive, rdp, unlock, cached, network_cleartext]
group_by: [user.name, host.name]
title: "Compte de service {user.name} : session {network.service} sur {host.name}"
dedup_window: 24h
mitre: [T1078.002]
playbook: playbooks/sensitive-accounts.md
