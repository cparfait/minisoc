id: UC-26
name: Échecs d'authentification d'un compte de service
type: threshold
severity: medium
description: >
  Un compte de service échoue à s'authentifier de façon répétée : mot de passe changé sans mise à jour sur une
  application ou un serveur (le service va tomber en panne), ou tentative sur un compte à privilèges.
filter:
  event.module: windows
  event.category: authentication
  event.outcome: failure
  user.roles: {contains: service}
group_by: [user.name]
window: 15m
condition: count() >= 5
title: "Compte de service {user.name} : {value} échecs d'authentification en 15 min"
dedup_window: 12h
mitre: [T1110]
playbook: playbooks/sensitive-accounts.md
