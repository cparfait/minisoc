id: UC-31
name: Mot de passe DSRM modifié
type: match
severity: high
description: >
  Le mot de passe de restauration des services d'annuaire (DSRM) d'un contrôleur de domaine a été changé. Rare et
  sensible : il donne un accès administrateur local au contrôleur, utilisé par certains attaquants comme porte
  dérobée.
filter:
  event.module: windows
  event.action: dsrm_password_set
group_by: [host.name]
title: "Mot de passe DSRM modifié sur {host.name} par {user.name}"
dedup_window: 1h
mitre: [T1098]
playbook: playbooks/sensitive-accounts.md
