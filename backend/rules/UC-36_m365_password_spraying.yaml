id: UC-36
name: Pulvérisation de mots de passe sur Microsoft 365
type: threshold
severity: high
description: >
  Une même adresse essaie des mots de passe sur plusieurs comptes Microsoft 365 en une heure : attaque par
  pulvérisation (quelques mots de passe courants essayés sur beaucoup de comptes).
filter:
  event.module: m365
  event.outcome: failure
  event.reason: [invalid_credentials, unknown_user]
group_by: [source.ip]
window: 1h
condition: count_distinct(user.name) >= 5
title: "Pulvérisation Microsoft 365 depuis {source.ip} : {value} comptes visés en 1 h"
dedup_window: 24h
storm_limit: 3
mitre: [T1110.003]
playbook: playbooks/m365-account.md
