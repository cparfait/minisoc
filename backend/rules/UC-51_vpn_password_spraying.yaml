id: UC-51
name: Pulvérisation de mots de passe sur le VPN
type: threshold
severity: high
description: >
  De nombreux comptes différents échouent à se connecter au VPN ou au portail VPN en peu de temps : un attaquant
  essaie une liste de noms (administrator, test, service…) avec des mots de passe courants. Détecté sans l'adresse
  source, que le portail VPN des versions récentes de SFOS journalise comme 127.0.0.1. Les comptes existants de
  l'annuaire risquent le verrouillage ou, pour un mot de passe faible, la compromission.
filter:
  event.module: sophos_xgs
  event.category: authentication
  event.outcome: failure
  network.service: [ssl_vpn, ipsec, l2tp, user_portal]
group_by: [network.service]
window: 10m
condition: count_distinct(user.name) >= 10
title: "Pulvérisation de mots de passe sur le VPN ({network.service}) : {value} comptes différents en échec en 10 min"
dedup_window: 24h
storm_limit: 3
mitre: [T1110.003, T1133]
playbook: playbooks/vpn-bruteforce.md
