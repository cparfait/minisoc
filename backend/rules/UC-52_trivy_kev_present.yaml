id: UC-52
name: Faille activement exploitée dans une image ou un serveur (Trivy)
type: match
severity: from_event
category: hygiene
description: >
  Trivy trouve, dans une image Docker ou sur un serveur analysé, un composant touché par une vulnérabilité du
  catalogue CISA KEV : elle est exploitée activement par des attaquants. Ce n'est pas une attaque constatée mais une
  porte ouverte à refermer en priorité. Seules les failles apparues depuis le rapport précédent sont signalées ;
  l'état complet est sur la page Vulnérabilités.
filter:
  event.module: trivy
  event.action: kev_vulnerabilities
group_by: [host.name]
title: "{message}"
dedup_window: 7d
storm_limit: 10
mitre: [T1190, T1068]
playbook: playbooks/trivy-vulnerabilities.md
