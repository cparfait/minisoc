id: UC-53
name: Faille critique corrigeable dans une image ou un serveur (Trivy)
type: match
severity: from_event
category: hygiene
description: >
  Trivy trouve une vulnérabilité critique (ou haute, si l'option est activée dans la fiche Trivy) pour laquelle une
  version corrigée existe : la mise à jour du composant ou de l'image suffit à la refermer. Seules les failles
  apparues depuis le rapport précédent sont signalées.
filter:
  event.module: trivy
  event.action: [critical_fixable, high_fixable]
group_by: [host.name, event.action]
title: "{message}"
dedup_window: 7d
storm_limit: 10
mitre: [T1190]
playbook: playbooks/trivy-vulnerabilities.md
