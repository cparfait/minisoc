# Installation automatique de la VM Mini-SOC (Debian 13), conforme à docs/04-installation-durcissement-vm.md § 3.
# Les valeurs propres au site (réseau, mot de passe) sont dans site.cfg, généré par build-iso.sh.
d-i preseed/include string site.cfg

# --- Langue, clavier, heure ---
d-i debian-installer/locale string fr_FR.UTF-8
d-i keyboard-configuration/xkb-keymap select fr
d-i time/zone string Europe/Paris
d-i clock-setup/utc boolean true
d-i clock-setup/ntp boolean false

# --- Réseau : IP fixe, pas de DHCP ---
d-i netcfg/choose_interface select auto
d-i netcfg/disable_autoconfig boolean true
d-i netcfg/confirm_static boolean true
d-i netcfg/wireless_wep string
d-i hw-detect/load_firmware boolean false

# --- Miroir ---
d-i mirror/country string manual
d-i mirror/http/hostname string deb.debian.org
d-i mirror/http/directory string /debian

# --- Comptes : root verrouillé, adminsoc reçoit sudo ---
d-i passwd/root-login boolean false
d-i passwd/make-user boolean true
d-i passwd/user-fullname string Administrateur Mini-SOC
d-i passwd/username string adminsoc
d-i user-setup/allow-password-weak boolean false
d-i user-setup/encrypt-home boolean false

# --- Disque système (le plus petit disque) : EFI, échange 2 Go, / 30 Go, /var/log le reste ---
# Le disque de données est formaté au premier démarrage et monté sur /var/lib/docker.
d-i partman/early_command string sh /cdrom/minisoc/choose-disk.sh
d-i partman-auto/method string regular
d-i partman-partitioning/choose_label select gpt
d-i partman-partitioning/default_label string gpt
d-i partman-lvm/device_remove_lvm boolean true
d-i partman-md/device_remove_md boolean true
d-i partman-lvm/confirm boolean true
d-i partman-lvm/confirm_nooverwrite boolean true
d-i partman-auto/choose_recipe select minisoc
d-i partman-auto/expert_recipe string \
  minisoc :: \
    1 1 1 free $iflabel{ gpt } $reusemethod{ } method{ biosgrub } . \
    512 512 512 fat32 $iflabel{ gpt } $reusemethod{ } method{ efi } format{ } . \
    2048 2048 2048 linux-swap method{ swap } format{ } . \
    20480 30720 30720 ext4 method{ format } format{ } use_filesystem{ } filesystem{ ext4 } mountpoint{ / } . \
    6144 8192 -1 ext4 method{ format } format{ } use_filesystem{ } filesystem{ ext4 } mountpoint{ /var/log } \
      options/nodev{ nodev } options/nosuid{ nosuid } options/noexec{ noexec } .
d-i partman-basicfilesystems/no_swap boolean false
d-i partman-efi/non_efi_system boolean true
d-i partman/mount_style select uuid
d-i partman-partitioning/confirm_write_new_label boolean true
d-i partman/choose_partition select finish
d-i partman/confirm boolean true
d-i partman/confirm_nooverwrite boolean true

# --- Paquets : serveur SSH et utilitaires usuels uniquement ---
d-i base-installer/kernel/image string linux-image-amd64
d-i apt-setup/services-select multiselect security, updates
d-i apt-setup/cdrom/set-first boolean false
d-i apt-setup/disable-cdrom-entries boolean true
tasksel tasksel/first multiselect standard, ssh-server
d-i pkgsel/include string curl ca-certificates gnupg chrony auditd audispd-plugins unattended-upgrades \
  apt-listchanges iptables nftables rsync lynis needrestart open-vm-tools python3
d-i pkgsel/upgrade select full-upgrade
popularity-contest popularity-contest/participate boolean false

# --- Chargeur de démarrage ---
d-i grub-installer/only_debian boolean true
d-i grub-installer/with_other_os boolean false
d-i grub-installer/bootdev string default
d-i grub-installer/force-efi-extra-removable boolean true

# --- Fin : premier démarrage préparé, CD éjecté ---
d-i preseed/late_command string sh /cdrom/minisoc/late.sh
d-i cdrom-detect/eject boolean true
d-i finish-install/reboot_in_progress note
