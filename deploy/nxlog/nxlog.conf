#     Module        im_file
#     File          "C:\\Windows\\System32\\dns\\dns.log"
#     ReadFromLast  TRUE
#     Exec          if not ($raw_event =~ / PACKET .* Rcv /) drop();
#     Exec          if ($raw_event =~ /\(5\)mairie\(5\)local\(0\)/i) or ($raw_event =~ / PTR /) drop();
# </Input>
#
# <Route dns_vers_minisoc>
#     Path    dns => minisoc
# </Route>
