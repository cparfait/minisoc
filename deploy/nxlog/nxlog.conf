## NXLog Community Edition (gratuite, v3.2) : envoi des événements de sécurité Windows au Mini-SOC.
## À installer sur chaque contrôleur de domaine, ou sur un serveur collecteur (Windows Event Forwarding).
## Remplacer MINISOC_IP par l'adresse du Mini-SOC. Fichier : C:\Program Files\nxlog\conf\nxlog.conf
## N'utilise que des modules de l'édition gratuite (im_msvistalog, im_file, xm_json, xm_syslog, om_tcp, om_ssl).

define ROOT C:\Program Files\nxlog
Moduledir %ROOT%\modules
CacheDir  %ROOT%\data
Pidfile   %ROOT%\data\nxlog.pid
SpoolDir  %ROOT%\data
LogFile   %ROOT%\data\nxlog.log

<Extension json>
    Module  xm_json
</Extension>

<Extension syslog>
    Module  xm_syslog
</Extension>

<Input securite>
    Module  im_msvistalog
    # Uniquement les événements utiles à la détection (limite le volume)
    <QueryXML>
        <QueryList>
            <Query Id="0">
                <!-- Ouvertures de session, verrouillages, audit, journal effacé. Windows refuse une sélection de
                     plus de 22 conditions : la liste est répartie sur deux sélections pour garder de la marge -->
                <Select Path="Security">*[System[(EventID=4624 or EventID=4625 or EventID=4771 or EventID=4776 or EventID=4740 or EventID=4767 or EventID=4719 or EventID=4794 or EventID=1102)]]</Select>
                <!-- Gestion des comptes et des groupes -->
                <Select Path="Security">*[System[(EventID=4720 or EventID=4722 or EventID=4723 or EventID=4724 or EventID=4725 or EventID=4726 or EventID=4728 or EventID=4729 or EventID=4732 or EventID=4733 or EventID=4756 or EventID=4757)]]</Select>
                <!-- Tickets Kerberos chiffrés en RC4 seulement (kerberoasting, UC-30) : les tickets AES sont trop nombreux -->
                <Select Path="Security">*[System[(EventID=4769)] and EventData[Data[@Name='TicketEncryptionType']='0x17']]</Select>
                <!-- Serveurs de fichiers : suppressions et renommages (droit DELETE) sur les dossiers audités (UC-32) -->
                <Select Path="Security">*[System[(EventID=4663)] and EventData[Data[@Name='AccessMask']='0x10000']]</Select>
                <Select Path="System">*[System[(EventID=7045 or EventID=104)]]</Select>
                <!-- Serveurs de fichiers : fichier de rançongiciel bloqué par un filtre FSRM (UC-33) -->
                <Select Path="Application">*[System[Provider[@Name='SRMSVC'] and (EventID=8215)]]</Select>
                <Select Path="ForwardedEvents">*</Select>
            </Query>
        </QueryList>
    </QueryXML>
    # Ouvertures de session réseau des comptes machine : très nombreuses et sans intérêt ici
    Exec if ($EventID == 4624) and ($TargetUserName =~ /\$$/) drop();
    # L'édition gratuite écrit les dates en heure locale, sans fuseau : heure exacte ajoutée en millisecondes UTC
    Exec $EventTimeUTC = integer($EventTime) / 1000;
    Exec to_json();
</Input>

<Output minisoc>
    Module  om_tcp
    Host    MINISOC_IP
    Port    514
    Exec    $Message = $raw_event; to_syslog_bsd();
</Output>

## Variante chiffrée (TLS, port 6514) : remplacer le bloc ci-dessus par celui-ci, copier ca.crt (généré par
## scripts/syslog_cert.sh sur le Mini-SOC) dans C:\Program Files\nxlog\cert\ et utiliser le NOM DNS du Mini-SOC.
# <Output minisoc>
#     Module          om_ssl
#     Host            MINISOC_NOM_DNS
#     Port            6514
#     CAFile          %ROOT%\cert\ca.crt
#     AllowUntrusted  FALSE
#     Exec            $Message = $raw_event; to_syslog_bsd();
# </Output>

<Route securite_vers_minisoc>
    Path    securite => minisoc
</Route>

## ---------------------------------------------------------------------------------------------------------------
## Requêtes DNS des contrôleurs de domaine (facultatif, guide « DNS des contrôleurs de domaine » du Mini-SOC).
## Journal de débogage DNS (Console DNS › Propriétés du serveur › Journalisation de débogage : paquets entrants,
## requêtes, UDP et TCP, fichier C:\Windows\System32\dns\dns.log, taille 500 Mo).
## La lecture directe du fournisseur ETW du serveur DNS (module im_etw) n'existe que dans l'édition payante de
## NXLog : elle n'est pas utilisée. Requêtes vers la zone interne et résolutions inverses écartées dès le contrôleur
## pour limiter le volume (adapter « mairie » et « local » au nom de votre domaine).
