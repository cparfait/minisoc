name: minisoc

# Images tierces : image officielle + correctifs Alpine publiés depuis (deploy/images/alpine-patch.Dockerfile)
x-patched: &patched
  context: ./deploy/images
  dockerfile: alpine-patch.Dockerfile

x-backend: &backend
  build:
    context: ./backend
    target: runtime
  image: minisoc-backend:latest
  restart: unless-stopped
  env_file: .env
  # Archives scellées des événements (minisoc/archives.py) : à copier hors de la VM avec les sauvegardes
  volumes: [archives:/var/lib/minisoc/archives]
  environment:
    MINISOC_DATABASE_URL: postgresql+asyncpg://minisoc:${POSTGRES_PASSWORD:?définir POSTGRES_PASSWORD}@postgres:5432/minisoc
    MINISOC_CLICKHOUSE_PASSWORD: ${CLICKHOUSE_PASSWORD:?définir CLICKHOUSE_PASSWORD}
  depends_on:
    postgres: { condition: service_healthy }
    redis: { condition: service_healthy }
    clickhouse: { condition: service_healthy }
  networks: [backend, data]

services:
  postgres:
    # Version majeure = nom du volume (pgdata18) : une montée de version majeure crée un nouveau volume et
    # minisoc-update y migre les données (export de l'ancienne version, import dans la nouvelle) ; l'ancien volume
    # reste intact pour un retour arrière
    # Le numéro de version majeure du nom de l'image sert aussi à minisoc-update (migration ci-dessus)
    build: { <<: *patched, args: { BASE: "postgres:18-alpine@sha256:77f585114c32fbca283dc835b0596f4e52b51b4c6662d7810b2f4084f60a1873" } }
    image: minisoc-postgres:18
    restart: unless-stopped
    environment:
      POSTGRES_DB: minisoc
      POSTGRES_USER: minisoc
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes: [pgdata18:/var/lib/postgresql]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U minisoc -d minisoc"]
      interval: 5s
      retries: 20
    networks: [data]

  redis:
    build: { <<: *patched, args: { BASE: "redis:8-alpine@sha256:3811787313eba226a2ef38658c6ccb91cd5e110edc89c37767de373120a0e5a0" } }
    image: minisoc-redis:8
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes", "--appendfsync", "everysec", "--save", "300", "1"]
    volumes: [redisdata:/data]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      retries: 20
    networks: [data]

  clickhouse:
    # Variante Alpine : même serveur et même compte (uid 101) que l'image Ubuntu, sans ses dizaines de paquets
    # vulnérables sans correctif (busybox, glibc, pcre2…)
    build: { <<: *patched, args: { BASE: "clickhouse/clickhouse-server:26.9-alpine@sha256:ebfa2210dce4d75af8f73ef02588d1a8fc67a44dcdd573a6c8055597177c1ca1" } }
    image: minisoc-clickhouse:26.9
    restart: unless-stopped
    environment:
      CLICKHOUSE_DB: minisoc
      CLICKHOUSE_USER: minisoc
      CLICKHOUSE_PASSWORD: ${CLICKHOUSE_PASSWORD}
      CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT: 0
    ulimits:
      nofile: { soft: 262144, hard: 262144 }
    volumes: [chdata:/var/lib/clickhouse]
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:8123/ping || exit 1"]
      interval: 5s
      retries: 30
    networks: [data]

  api:
    <<: *backend
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/health', timeout=5)"]
      interval: 30s
      retries: 3

  worker:
    <<: *backend
    command: ["python", "-m", "minisoc.worker"]
    volumes:
      # Bases GeoIP (MaxMind GeoLite2) : téléchargées et mises à jour par le worker (Intégrations › Géolocalisation)
      - geoip:/app/data/geoip
      # La liste remplace celle du modèle commun : le volume des archives est donc repris ici
      - archives:/var/lib/minisoc/archives
      # Échange avec le service minisoc-trivy de la VM (rapports, état, demande d'analyse) : dossier de l'hôte
      - ${TRIVY_DIR:-./data/trivy}:/var/lib/minisoc/trivy
      # Espace des disques de la VM, relevé par le service minisoc-disk de l'hôte (deploy/disk) : lecture seule
      - ${DISK_DIR:-./data/disques}:/var/lib/minisoc/disques:ro

  # Réception syslog des équipements (Sophos, Vectra, Varonis…) avec tampon disque, relayée à l'API
  vector:
    build: &vector-build { <<: *patched, args: { BASE: "timberio/vector:0.59.0-alpine@sha256:0e36bc2a290039e9b6a5e92f04bd2f133223506f72d09682c1df16c015172b7a" } }
    image: &vector-image minisoc-vector:0.59.0
    restart: unless-stopped
    # Recharge la configuration quand vector.yaml change (sinon : docker compose up -d --force-recreate vector)
    command: ["--config", "/etc/vector/vector.yaml", "--watch-config"]
    secrets: [minisoc_ingest_token]  # jeton d'envoi à l'API, lu par Vector dans /run/secrets
    volumes:
      - ./deploy/vector/vector.yaml:/etc/vector/vector.yaml:ro
      - vectordata:/var/lib/vector
    ports:
      - "${SYSLOG_BIND:-0.0.0.0}:514:514/udp"
      - "${SYSLOG_BIND:-0.0.0.0}:514:514/tcp"
    depends_on: [api]
    networks: [backend]

  # Syslog chiffré (TLS, TCP 6514) : activé avec COMPOSE_PROFILES=…,syslog-tls après ./scripts/syslog_cert.sh
  vector-tls:
    build: *vector-build
    image: minisoc-vector:0.59.0
    profiles: ["syslog-tls"]
    restart: unless-stopped
    command: ["--config", "/etc/vector/vector-tls.yaml", "--watch-config"]
    secrets: [minisoc_ingest_token]  # jeton d'envoi à l'API, lu par Vector dans /run/secrets
    volumes:
      - ./deploy/vector/vector-tls.yaml:/etc/vector/vector-tls.yaml:ro
      - ./data/syslog-tls:/etc/vector/tls:ro
      - vectortlsdata:/var/lib/vector
    ports:
      - "${SYSLOG_BIND:-0.0.0.0}:6514:6514/tcp"
    depends_on: [api]
    networks: [backend]

  # Relais syslog : n'existe que pendant minisoc-update, le temps de recréer « vector » (le port 514 lui est
  # renvoyé par une règle temporaire du pare-feu) ; même image fraîchement reconstruite, même configuration. Publié
  # sur 127.0.0.1 seulement : le réseau n'y accède que par le renvoi du 514, filtré comme lui (DOCKER-USER).
  vector-relais:
    image: *vector-image
    pull_policy: never
    profiles: ["relais"]
    restart: "no"
    command: ["--config", "/etc/vector/vector.yaml"]
    secrets: [minisoc_ingest_token]
    volumes:
      - ./deploy/vector/vector.yaml:/etc/vector/vector.yaml:ro
      - vectorrelaisdata:/var/lib/vector  # tampon disque : ce qui n'a pas été transmis l'est au relais suivant
    ports:
      - "127.0.0.1:5514:514/udp"
      - "127.0.0.1:5514:514/tcp"
    networks: [backend]

  # Trivy : jamais lancé par Compose, mais par le service minisoc-trivy de la VM (deploy/trivy), chaque semaine ou à
  # la demande ; image corrigée et reconstruite à chaque mise à jour comme les autres (profil « outils »)
  trivy:
    build: { <<: *patched, args: { BASE: "aquasec/trivy:0.76.0@sha256:2416d1f74045b57274df1a340eee6b510cacd73c66a6ccb8da092b117eb7d222" } }
    image: minisoc-trivy:0.76.0
    profiles: ["outils"]

  # Interface web + reverse proxy HTTPS (seul point d'entrée HTTP)
  web:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    image: minisoc-web:latest
    restart: unless-stopped
    environment:
      MINISOC_HOSTNAME: ${MINISOC_HOSTNAME:-localhost}
      MINISOC_TLS: ${MINISOC_TLS:-internal}
      # Adresse IP de l'interface : https://<IP> renvoie vers MINISOC_HOSTNAME
      MINISOC_IP: ${WEB_BIND:-127.0.0.1}
      # Serveurs Trivy limités à l'envoi de leurs rapports, sauf adresses d'administration ou d'écran mural
      # (deploy/caddy/Caddyfile) : listes du pare-feu recopiées dans .env par sudo minisoc-setup
      MINISOC_TRIVY_IPS: ${MINISOC_TRIVY_IPS:-}
      MINISOC_WEB_IPS: ${MINISOC_WEB_IPS:-}
    ports:
      - "${WEB_BIND:-0.0.0.0}:443:443"
      - "${WEB_BIND:-0.0.0.0}:80:80"
    volumes:
      - caddydata:/data
      # Certificat de votre PKI ou wildcard (voir MINISOC_TLS) ; vide avec l'autorité interne de Caddy
      - ${MINISOC_TLS_DIR:-./data/tls}:/certs:ro
    depends_on: [api]
    networks: [backend]

volumes:
  pgdata18:
  redisdata:
  chdata:
  vectordata:
  vectortlsdata:
  vectorrelaisdata:
  caddydata:
  archives:
  geoip:

# Jeton d'ingestion pour Vector, tiré de .env (MINISOC_INGEST_TOKEN) : fichier en lecture seule dans le conteneur.
# Depuis Vector 0.59, « ${MINISOC_INGEST_TOKEN} » n'est plus remplacé dans sa configuration.
secrets:
  minisoc_ingest_token:
    environment: MINISOC_INGEST_TOKEN

networks:
  backend:
  # Bases de données : réseau sans aucune sortie (ni LAN ni Internet), joignable seulement par l'API et le worker
  data:
    internal: true
